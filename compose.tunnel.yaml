# Optional public HTTPS ingress. Start only after changing the initial admin password.
services:
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in your private .env}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
