services:
  web:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ivett-data:/data
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ADMIN_RECOVERY_EMAIL: ${ADMIN_RECOVERY_EMAIL:-}
      RESEND_FROM: ${RESEND_FROM:-}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
    restart: unless-stopped
volumes:
  ivett-data:
